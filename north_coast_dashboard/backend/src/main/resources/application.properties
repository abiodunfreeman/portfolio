spring.application.name=north-coast-api
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=jdbc:h2:mem:northcoast;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'America/New_York'
spring.sql.init.mode=always
spring.h2.console.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5175,http://127.0.0.1:5175}
app.openai.api-key=${OPENAI_API_KEY:}
app.openai.model=${OPENAI_MODEL:gpt-5.6-luna}
